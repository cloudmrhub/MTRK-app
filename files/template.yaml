AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Single-Lambda Flask backend (cloud_entry) behind API Gateway HTTP API with S3 artifacts

Globals:
  Function:
    Timeout: 120                 # adjust for your heaviest route
    MemorySize: 2048             # more memory => more vCPU; bump if NumPy heavy
    Architectures: [ x86_64 ]    # keep x86_64 unless you’ve built for arm64
    EphemeralStorage:
      Size: 10240                # /tmp size in MB (max 10240)
    Environment:
      Variables:
        ARTIFACT_BUCKET: !Ref ArtifactBucket
    Policies:
      - S3WritePolicy:
          BucketName: !Ref ArtifactBucket
      - S3ReadPolicy:
          BucketName: !Ref ArtifactBucket

Resources:
  # HTTP API (proxy all routes to Lambda)
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']          # tighten for prod (e.g., your CF domain)
        AllowHeaders: ['content-type','authorization']
        AllowMethods: ['GET','POST','PUT','DELETE','OPTIONS']

  # Private artifact bucket for generated files (mtrk/seq, etc.)
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
    DeletionPolicy: Retain

  # Your app as a single Lambda container.
  AppFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
    Metadata:
      Dockerfile: Dockerfile      # must build cloud_entry:app
      DockerContext: .            # project root
      DockerTag: latest

  # OPTIONAL: keep 1 warm instance for low latency (comment out if not needed)
  AppFunctionAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref AppFunction
      FunctionVersion: !GetAtt AppFunction.Version
      Name: live
      ProvisionedConcurrencyConfig:
        ProvisionedConcurrentExecutions: 1

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  BucketName:
    Description: S3 bucket for artifacts
    Value: !Ref ArtifactBucket
