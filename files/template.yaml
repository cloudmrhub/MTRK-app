AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Single-Lambda Flask backend (cloud_entry) behind API Gateway HTTP API with S3 artifacts

Globals:
  Function:
    Timeout: 120
    MemorySize: 2048
    Architectures: [ x86_64 ]
    EphemeralStorage:
      Size: 10240                 # /tmp size in MB (max 10240)
    Environment:
      Variables:
        ARTIFACT_BUCKET: !Ref ArtifactBucket

Resources:
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']        # tighten for prod
        AllowHeaders: ['content-type','authorization']
        AllowMethods: ['GET','POST','PUT','DELETE','OPTIONS']

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
    DeletionPolicy: Retain

  AppFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      # Give the function S3 read/write on the artifact bucket
      Policies:
        - S3WritePolicy:
            BucketName: !Ref ArtifactBucket
        - S3ReadPolicy:
            BucketName: !Ref ArtifactBucket
      # Publish a version + alias automatically so we can attach provisioned concurrency
      AutoPublishAlias: live
      ProvisionedConcurrencyConfig:
        ProvisionedConcurrentExecutions: 1
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: latest

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  BucketName:
    Description: S3 bucket for artifacts
    Value: !Ref ArtifactBucket
